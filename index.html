<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클로드 활용 스네이크 게임</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card-bg: #ffffff;
    --text: #1f2430;
    --sub: #6b7280;
    --accent: #4f46e5;
    --border: #e5e7eb;
    --board-bg: #1f2430;
    --snake: #4f46e5;
    --snake-head: #818cf8;
    --food: #f43f5e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 40px 20px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header a {
    font-size: 13px;
    color: var(--sub);
    text-decoration: none;
  }
  header h1 {
    font-size: 24px;
    margin: 8px 0 0;
  }
  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .scoreboard {
    display: flex;
    gap: 24px;
    font-size: 14px;
    color: var(--sub);
  }
  .scoreboard b {
    color: var(--text);
    font-size: 16px;
  }
  #board {
    background: var(--board-bg);
    border-radius: 10px;
    touch-action: none;
  }
  .controls {
    display: grid;
    grid-template-columns: 50px 50px 50px;
    grid-template-rows: 44px 44px 44px;
    gap: 6px;
    margin-top: 4px;
  }
  .controls button {
    background: var(--board-bg);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
  }
  .controls button:active {
    opacity: 0.7;
  }
  .ctrl-up { grid-column: 2; grid-row: 1; }
  .ctrl-left { grid-column: 1; grid-row: 2; }
  .ctrl-right { grid-column: 3; grid-row: 2; }
  .ctrl-down { grid-column: 2; grid-row: 3; }
  .hint {
    font-size: 12px;
    color: var(--sub);
    text-align: center;
  }
  .restart-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
    display: none;
  }
  .restart-btn:hover {
    opacity: 0.9;
  }
  .overlay-msg {
    font-size: 15px;
    font-weight: 600;
    color: #e11d48;
    display: none;
  }
</style>
</head>
<body>

<header>
  <a href="https://fatemap6833.github.io/">← 실습 자료 모음으로</a>
  <h1>🐍 클로드 활용 스네이크 게임</h1>
</header>

<div class="panel">
  <div class="scoreboard">
    <span>점수 <b id="score">0</b></span>
    <span>최고 점수 <b id="best">0</b></span>
  </div>

  <canvas id="board" width="320" height="320"></canvas>

  <div class="overlay-msg" id="overMsg">게임 오버!</div>
  <button class="restart-btn" id="restartBtn">다시 시작</button>

  <div class="controls">
    <button class="ctrl-up">↑</button>
    <button class="ctrl-left">←</button>
    <button class="ctrl-right">→</button>
    <button class="ctrl-down">↓</button>
  </div>

  <div class="hint">방향키 또는 화면의 버튼으로 조작하세요</div>
</div>

<script>
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const CELL = 16;
  const COLS = canvas.width / CELL;
  const ROWS = canvas.height / CELL;

  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overMsg = document.getElementById("overMsg");
  const restartBtn = document.getElementById("restartBtn");

  const BEST_KEY = "snake-best-score";
  let best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10);
  bestEl.textContent = best;

  let snake, dir, nextDir, food, score, alive, speedMs, timer;

  function resetGame() {
    snake = [{ x: 8, y: 8 }, { x: 7, y: 8 }, { x: 6, y: 8 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    alive = true;
    speedMs = 130;
    scoreEl.textContent = score;
    overMsg.style.display = "none";
    restartBtn.style.display = "none";
    placeFood();
    clearInterval(timer);
    timer = setInterval(tick, speedMs);
    draw();
  }

  function placeFood() {
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function tick() {
    if (!alive) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver() {
    alive = false;
    clearInterval(timer);
    overMsg.style.display = "block";
    restartBtn.style.display = "inline-block";
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
      bestEl.textContent = best;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#f43f5e";
    ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);

    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#818cf8" : "#4f46e5";
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }

  function setDir(x, y) {
    if (dir.x === -x && dir.y === -y) return;
    nextDir = { x, y };
  }

  document.addEventListener("keydown", e => {
    switch (e.key) {
      case "ArrowUp": case "w": case "W": setDir(0, -1); break;
      case "ArrowDown": case "s": case "S": setDir(0, 1); break;
      case "ArrowLeft": case "a": case "A": setDir(-1, 0); break;
      case "ArrowRight": case "d": case "D": setDir(1, 0); break;
    }
  });

  document.querySelector(".ctrl-up").addEventListener("click", () => setDir(0, -1));
  document.querySelector(".ctrl-down").addEventListener("click", () => setDir(0, 1));
  document.querySelector(".ctrl-left").addEventListener("click", () => setDir(-1, 0));
  document.querySelector(".ctrl-right").addEventListener("click", () => setDir(1, 0));

  restartBtn.addEventListener("click", resetGame);

  resetGame();
</script>

</body>
</html>
